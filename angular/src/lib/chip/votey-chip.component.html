<div
  class="chip"
  [class.disabled]="disabled()"
  [attr.aria-disabled]="disabled()"
>
  <span class="label">
    <vt-text
      variant="caption"
      [content]="label()"
      [color]="disabled() ? 'muted' : 'primary'"
    />
  </span>
  @if (showRemove()) {
  @let removeAction = "BUTTON.REMOVE" | vtTranslate;
  <vt-button
    class="remove"
    variant="ghost"
    size="small"
    ico="ui-close"
    [disabled]="disabled()"
    [ariaLabel]="removeAction + ': ' + label()"
    [disabledNote]="removeTooltip()"
    [tooltipText]="removeTooltip()"
    (pressed)="removed.emit()"
  />
  }
</div>
