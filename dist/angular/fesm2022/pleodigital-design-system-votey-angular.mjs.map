<div
  class="text-area-wrapper"
  [class.disabled]="effectiveDisabled()"
  [class.error]="hasError()"
  [class.filled]="textValue().length > 0"
>
  @if (label()) {
  <vt-text
    variant="label"
    color="secondary"
    [content]="label() | vtTranslate"
  />
  }

  <div class="field">
    <textarea
      #textareaElement
      class="control"
      [value]="textValue()"
      [placeholder]="placeholder()"
      [disabled]="effectiveDisabled()"
      [required]="isRequired()"
      [spellcheck]="spellcheck()"
      [attr.minlength]="minLength()"
      [attr.maxlength]="maxLength()"
      [attr.aria-label]="(label() | vtTranslate) || null"
      [attr.aria-invalid]="hasError() ? true : null"
      [attr.data-cy]="dataCy() || null"
      (input)="handleInput($event)"
      (focus)="handleFocus($event)"
      (blur)="handleBlur($event)"
      (keydown)="handleKeyDown($event)"
    ></textarea>
  </div>

  @if (helper()) {
  <vt-text
    variant="caption-s"
    color="muted"
    [content]="helper() | vtTranslate"
  />
  }

  @if (errorTranslationKey()) {
  <vt-text
    role="alert"
    variant="caption-s"
    color="error"
    [content]="errorTranslationKey() | vtTranslate"
  />
  }
</div>
