<nav class="tabs-wrapper" role="tablist" [attr.aria-label]="ariaLabel()">
  <div #track class="track" role="presentation">
    @for (item of items(); track item.id) {
      <button
        #tabButton
        class="tab"
        type="button"
        role="tab"
        [id]="idPrefix() + '-' + item.id"
        [attr.aria-controls]="panelId()"
        [attr.aria-selected]="selectedId() === item.id"
        [attr.tabindex]="selectedId() === item.id ? 0 : -1"
        [class.active]="selectedId() === item.id"
        [disabled]="item.disabled ?? false"
        (click)="select(item)"
        (keydown)="onKeydown($event, item)"
      >
        <vt-text
          class="label"
          variant="action"
          [content]="item.label | vtTranslate"
          [uppercase]="true"
        />
        @if (item.count !== null && item.count !== undefined) {
          <vt-text
            class="count"
            variant="caption"
            [color]="selectedId() === item.id ? 'accent' : 'secondary'"
            [content]="item.count"
          />
        }
      </button>
    }
    <div #indicator class="indicator" aria-hidden="true"></div>
  </div>
</nav>
