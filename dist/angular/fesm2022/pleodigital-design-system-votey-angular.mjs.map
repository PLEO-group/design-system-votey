@let translatedText = text() | vtTranslate; @let translatedTooltipText =
resolvedTooltipText() | vtTranslate;
<div
  class="button-wrapper"
  matTooltipPosition="above"
  [matTooltipDisabled]="!translatedTooltipText"
  [matTooltipShowDelay]="500"
  [matTooltip]="translatedTooltipText"
>
  <button
    [class]="buttonClasses()"
    [class.icon-button]="isIconButton()"
    [class.disabled]="disabled()"
    [disabled]="disabled()"
    [attr.aria-disabled]="disabled()"
    [attr.aria-expanded]="ariaExpanded()"
    [attr.aria-haspopup]="ariaHasPopup()"
    [attr.aria-controls]="ariaControls()"
    [attr.aria-label]="translatedText || translatedTooltipText || ico() || null"
    [type]="type()"
    (click)="pressed.emit()"
  >
    @if (ico()) {
    <span class="icon">
      <vt-icon [ico]="ico()" />
    </span>
    } @if (text()) {
    <span class="label">{{ translatedText }}</span>
    } @if (badge() !== null && badge() !== "") {
    <span class="badge">
      <vt-text variant="micro" color="primary" [content]="badge()" />
    </span>
    }
  </button>
</div>
