<div
  class="button-wrapper"
  matTooltipPosition="above"
  [matTooltipDisabled]="!resolvedTooltipText()"
  [matTooltipShowDelay]="500"
  [matTooltip]="resolvedTooltipText()"
>
  <button
    [class]="buttonClasses()"
    [class.icon-button]="isIconButton()"
    [class.disabled]="disabled()"
    [disabled]="disabled()"
    [attr.aria-disabled]="disabled()"
    [attr.aria-label]="text() || ico() || null"
    [type]="type()"
    (click)="pressed.emit()"
  >
    @if (ico()) {
    <span class="icon">
      <vt-icon [ico]="ico()" />
    </span>
    } @if (text()) {
    <span class="label">{{ text() }}</span>
    } @if (badge() !== null && badge() !== "") {
    <span class="badge">{{ badge() }}</span>
    }
  </button>
</div>
