name: 📦 NPM Publish on Merge

on:
  push:
    # Release uruchamia się po każdym pushu do main. Warunek joba poniżej
    # pomija commit utworzony przez ten workflow, aby uniknąć pętli.
    branches:
      - main
  workflow_dispatch: # Ręczne uruchamianie z zakładki Actions w GitHub

jobs:
  publish:
    # Nie uruchamiaj ponownie workflow dla commita wersji utworzonego poniżej.
    # Dzięki temu merge z dowolnym tytułem (np. "up") nadal uruchamia release.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')

    runs-on: ubuntu-latest

    # Uprawnienia dla bota GitHub, wymagane do interakcji z paczkami
    permissions:
      contents: write # Do robienia commita z nową wersją (jeśli będziesz wersjonować)
      packages: write # Wymagane, jeśli używasz GitHub Packages
      id-token: write # Wymagane dla OIDC/NPM Login (nowoczesna metoda)

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: 🔧 Install dependencies
        run: npm ci

      - name: ✅ Validate Token Sources
        run: npm run validate:tokens && npm run test:tokens

      # 1. Buduj tokeny (upewnij się, że folder dist/ jest świeży)
      # Ten krok jest opcjonalny, jeśli ufasz, że folder dist/ jest zawsze zmergowany
      # ale jest dobrym zabezpieczeniem.
      - name: 🎨 Build Design Tokens
        run: npm run build

      # 2. Zwiększenie wersji paczki (Automatyczne wersjonowanie)
      - name: 📈 Increment Package Version
        run: npm version patch --no-git-tag-version

      # 3. Publikuj przed commitem wersji. Jeśli token jest niepoprawny,
      # workflow zakończy się bez wypchnięcia kolejnego numeru wersji.
      - name: 🚀 Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 4. Konfiguracja Git dla commita
      - name: ⚙️ Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 5. Commituj oba manifesty: npm version aktualizuje package.json
      # oraz package-lock.json.
      - name: 💾 Commit new version
        run: |
          git add package.json package-lock.json
          git commit -m "chore(release): new version $(node -p "require('./package.json').version")"
          git push origin HEAD:main
