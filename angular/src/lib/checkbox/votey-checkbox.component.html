<mat-checkbox
  [class.checkbox-error]="error()"
  disableRipple
  [formControl]="formControl"
  [indeterminate]="indeterminate()"
  [required]="required()"
  [labelPosition]="labelPosition()"
  [id]="id()"
  [name]="name()"
  [value]="value()"
  [style.--votey-checkbox-checkmark-url]="checkmarkMaskUrl"
  (change)="handleChange($event)"
  (indeterminateChange)="indeterminate.set($event)"
>
  <ng-content>{{ label() | vtTranslate }}</ng-content>
</mat-checkbox>

<vt-form-error [errors]="errorKeys" [ignoredErrors]="ignoredErrors()" />
