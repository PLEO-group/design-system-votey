<nav class="tabs" role="tablist" [attr.aria-label]="ariaLabel()">
  <div #track class="track" role="presentation">
    @for (item of items(); track item.id) {
      <button
        #tabButton
        class="tab"
        type="button"
        role="tab"
        [id]="idPrefix() + '-' + item.id"
        [attr.aria-controls]="panelId()"
        [attr.aria-selected]="selectedId() === item.id"
        [attr.tabindex]="selectedId() === item.id ? 0 : -1"
        [class.active]="selectedId() === item.id"
        [disabled]="item.disabled ?? false"
        (click)="select(item)"
        (keydown)="onKeydown($event, item)"
      >
        <span class="label">{{ item.label | vtTranslate }}</span>
        @if (item.count !== null && item.count !== undefined) {
          <span class="count">{{ item.count }}</span>
        }
      </button>
    }
    <span #indicator class="indicator" aria-hidden="true"></span>
  </div>
</nav>
