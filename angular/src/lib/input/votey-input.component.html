@let translatedLabel = label() | vtTranslate;

<div
  class="input-wrapper"
  [class.underline]="variant() === 'underline'"
  [class.disabled]="isDisabled"
  [class.error]="hasError"
  [class.filled]="hasValue"
>
  @if (label()) {
    <label class="label" [for]="id()">
      <vt-text
        variant="label"
        [color]="isDisabled ? 'muted' : 'primary'"
        [content]="translatedLabel"
      />
    </label>
  }

  <div class="field">
    <input
      class="control"
      [id]="id()"
      [name]="name()"
      [type]="type()"
      [formControl]="formControl"
      [placeholder]="placeholder() | vtTranslate"
      [attr.disabled]="isDisabled ? '' : null"
      [required]="isRequired"
      [attr.inputmode]="inputMode() || null"
      [attr.min]="min()"
      [attr.max]="max()"
      [attr.minlength]="minLength()"
      [attr.maxlength]="maxLength()"
      [attr.pattern]="pattern() || null"
      [attr.aria-invalid]="hasError ? true : null"
      [attr.data-cy]="dataCy() || null"
      (blur)="blur.emit($event)"
      (keydown)="keyDown.emit($event)"
    />
  </div>

  @if (shouldShowHelper) {
    <p class="helper">
      <vt-text
        variant="caption-s"
        [color]="helperColor"
        [content]="helper() | vtTranslate"
      />
    </p>
  }

  <vt-form-error
    [errors]="showFormErrors ? errorKeys : []"
    [ignoredErrors]="ignoredErrors()"
  />
</div>
