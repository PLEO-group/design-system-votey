<div
  class="file-picker-wrapper"
  [class.disabled]="effectiveDisabled()"
  [class.filled]="hasFile()"
>
  @if (label()) {
  <vt-text variant="label" color="primary" [content]="label() | vtTranslate" />
  }

  <div
    class="row"
    [class.loading]="isLoading()"
    [attr.aria-busy]="isLoading()"
  >
    <div
      class="file-box"
      [class.dragging]="isDragging()"
      aria-live="polite"
      [attr.title]="resolvedFilename()"
      (dragenter)="handleDragEnter($event)"
      (dragover)="handleDragOver($event)"
      (dragleave)="handleDragLeave($event)"
      (drop)="handleDrop($event)"
    >
      @if (isLoading()) {
      <div class="loading-state" role="status">
        <span class="loading-spinner" aria-hidden="true"></span>
        <vt-text variant="caption" color="secondary" [content]="loadingText() | vtTranslate" />
        @if (progress() !== null) {
        <vt-text variant="caption" color="secondary" [content]="progress() + '%'" />
        }
      </div>
      } @else {
      <vt-text
        variant="caption"
        [color]="hasFile() ? 'primary' : 'muted'"
        [content]="
          resolvedFilename() ? resolvedFilename() : (emptyText() | vtTranslate)
        "
      />
      }
    </div>

    <vt-button
      variant="ghost"
      [text]="actionText()"
      [disabled]="effectiveDisabled()"
      (pressed)="open()"
    />

    @if (clearable() && hasFile() && !isLoading()) {
    <vt-button
      variant="ghost"
      size="small"
      ico="ui-delete"
      [tooltipText]="clearText()"
      [disabled]="effectiveDisabled()"
      (pressed)="clear()"
    />
    }

    <input
      #fileInput
      type="file"
      hidden
      [name]="name()"
      [disabled]="effectiveDisabled()"
      [required]="isRequired()"
      [attr.accept]="accept() || null"
      [attr.capture]="capture() || null"
      [attr.data-cy]="dataCy() || null"
      [multiple]="multiple()"
      (change)="handleChange($event)"
      (cancel)="handleCancel()"
    />
  </div>

  <vt-form-error
    [errors]="errorKeys"
    [ignoredErrors]="ignoredErrors()"
  />
</div>
