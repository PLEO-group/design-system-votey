@let translatedLabel = label() | vtTranslate;
@let accessibleName = ariaLabel() ? (ariaLabel() | vtTranslate) : translatedLabel;

<div
  class="text-area-wrapper"
  [class.disabled]="isDisabled"
  [class.error]="hasError"
  [class.filled]="(formControl.value ?? '').length > 0"
>
  @if (label()) {
    <label class="label" [for]="resolvedId()">
      <vt-text
        variant="label"
        color="primary"
        [content]="translatedLabel"
      />
    </label>
  }

  <div class="field">
    <textarea
      #textareaElement
      class="control"
      [id]="resolvedId()"
      [name]="name()"
      [placeholder]="placeholder() | vtTranslate"
      [formControl]="formControl"
      [disabled]="isDisabled"
      [required]="isRequired"
      [spellcheck]="spellcheck()"
      [attr.minlength]="minLength()"
      [attr.maxlength]="maxLength()"
      [attr.aria-label]="label() ? null : accessibleName || null"
      [attr.aria-describedby]="resolvedAriaDescribedby()"
      [attr.aria-invalid]="hasError ? true : null"
      [attr.aria-errormessage]="hasError ? errorId() : null"
      [attr.data-cy]="dataCy() || null"
      (input)="handleInput($event)"
      (keydown)="handleKeyDown($event)"
    ></textarea>
  </div>

  @let maxLengthValue = maxLength();

  @if (helper()) {
    <div class="helper" [id]="helperId()">
      <vt-text
        variant="caption-s"
        color="muted"
        [content]="helper() | vtTranslate"
      />
    </div>
  } @else if (maxLengthValue !== null) {
    @let translationParams = { max: maxLengthValue };

    <div class="helper" [id]="helperId()">
      <vt-text
        variant="caption-s"
        color="muted"
        [content]="limitDescription() | vtTranslate: translationParams"
      />
    </div>
  }

  <vt-form-error
    [id]="errorId()"
    [errors]="errorKeys"
    [ignoredErrors]="ignoredErrors()"
  />
</div>
